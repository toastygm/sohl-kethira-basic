# Run the checks on the pull request that broke them, not on the release
# afterwards.
#
# The four content repositories run this same file. What differs between them
# is only what they have to check: `lint:lang` appears where there is a
# `lang/` tree and not otherwise, because a step with nothing to check is not
# parity — it is a green tick that means nothing.
#
# ## Named steps, not one `npm run lint`
#
# The chain is `run-s`, which stops at the first failure, so a single step
# would report whichever check failed first and say nothing about the rest.
# That is how two of these repositories had checks whose state nobody knew: the
# chain never reached them. Each step runs under `if: \${{ !cancelled() }}`,
# so one failure does not hide the others, and a red run is a worklist rather
# than a wall.
#
# ## The compile is a second job
#
# It is the only check here that reaches the network — a satellite fetches the
# pinned system release its actors resolve against — so it has a failure surface
# none of the lint steps have, and mixing the two would make a third party's
# outage read as a content failure. And a compile failure and a lint failure are
# both worth seeing in one run, rather than whichever comes first hiding the
# other.
#
# Every run is cold: `build/` is gitignored and holds the dependency catalogue
# too, so a runner starts with nothing.
name: Lint

on:
    pull_request:
        types: [opened, reopened, synchronize]
    # Post-merge signal too: nothing else checks `main` between releases.
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint:
        name: Content, prose, and registry checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            # Every check below reads the tracked tree and needs only the
            # toolchain: nothing here fetches a dependency catalogue, compiles a
            # pack, or reaches the network.
            - name: Install dependencies
              run: npm ci

            # Prettier over the whole tree.
            - name: Check formatting
              run: npm run lint:format

            # markdownlint: document structure, and links that do not link.
            - name: Check markdown
              if: ${{ !cancelled() }}
              run: npm run lint:markdown

            # No dotted-prefix collision in `lang/*.json`. A key that is both a
            # leaf and a branch makes `foundry.utils.expandObject` throw, and
            # Foundry then drops the whole translation file.
            - name: Check localization files
              if: ${{ !cancelled() }}
              run: npm run lint:lang

            # Frontmatter against the schema each note's type declares.
            - name: Check addresses and frontmatter
              if: ${{ !cancelled() }}
              run: npm run lint:addresses

            # Every anchor link lands and every qualified address resolves.
            - name: Check content links
              if: ${{ !cancelled() }}
              run: npm run lint:content-links

            # `.github/labels.yml` and the §3 table of the issue-reporting doc
            # still name the same closed set.
            - name: Check label registry
              if: ${{ !cancelled() }}
              run: npm run lint:labels

    build:
        name: Content pack compile
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Stages the tree, compiles every pack, and emits the content index
            # — the cold build a tree that has already built once cannot
            # perform on itself.
            - name: Compile the content packs
              run: npm run build:db
